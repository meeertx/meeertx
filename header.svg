<svg width="1200" height="240" viewBox="0 0 1200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="240" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#1F2937" stroke-width="1" opacity="0.35">
    <path d="M0 60 H1200"/>
    <path d="M0 120 H1200"/>
    <path d="M0 180 H1200"/>
    <path d="M200 0 V240"/>
    <path d="M400 0 V240"/>
    <path d="M600 0 V240"/>
    <path d="M800 0 V240"/>
    <path d="M1000 0 V240"/>
  </g>

  <!-- decorative code symbol, right side -->
  <text x="1050" y="150" font-family="'Fira Code', 'Consolas', monospace" font-size="96" fill="#1F2937" font-weight="700">&lt;/&gt;</text>

  <!-- terminal-style prompt -->
  <text x="80" y="92" font-family="'Fira Code', 'Consolas', monospace" font-size="18" fill="#22D3EE">$ whoami</text>

  <!-- name -->
  <text x="80" y="140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="700" fill="#F9FAFB">Mert Urper</text>

  <!-- role -->
  <text x="80" y="176" font-family="'Fira Code', 'Consolas', monospace" font-size="18" fill="#9CA3AF">Software Engineer · Full-Stack Web &amp; Mobile · TypeScript · React-Native</text>

  <!-- blinking cursor -->
  <rect x="800" y="162" width="10" height="18" fill="#22D3EE">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- bottom accent line -->
  <rect x="0" y="236" width="1200" height="4" fill="url(#accent)"/>
</svg>
